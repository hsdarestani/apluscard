name: Read-only Production Wallet Balance Audit

on:
  push:
    branches: [audit-wallet-total-20260824]
    paths:
      - ".github/workflows/audit-wallet-total.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-wallet-total.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Aggregate SAMS wallet balances
    runs-on: ubuntu-latest
    environment: production
    env:
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PORT: "22"
      NEW_USER: root
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${NEW_HOST:?NEWHOST is missing}"
          : "${NEW_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "$NEW_PORT" "$NEW_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Query aggregate wallet balances
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$NEW_PORT" "$NEW_USER@$NEW_HOST" "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          SELECT 'TOTAL_WALLETS|' || COUNT(*) FROM cards_wallet;
          SELECT 'TOTAL_BALANCE|' || COALESCE(SUM(balance), 0) FROM cards_wallet;
          SELECT 'ACTIVE|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'ACTIVE';
          SELECT 'BLOCKED|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'BLOCKED';
          SELECT 'CLOSED|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'CLOSED';
          SELECT 'NEGATIVE|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE balance < 0;
          SELECT 'BUSINESS|' || b.id || '|' || replace(b.name, '|', '/') || '|' || b.slug || '|' || b.currency || '|' || COUNT(w.id) || '|' || COALESCE(SUM(w.balance), 0)
          FROM cards_business b
          LEFT JOIN cards_wallet w ON w.business_id = b.id
          GROUP BY b.id, b.name, b.slug, b.currency
          ORDER BY b.id;
          SQL
          REMOTE
