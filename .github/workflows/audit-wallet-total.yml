name: Read-only Production Wallet Balance Audit

on:
  push:
    branches: [audit-wallet-total-20260824]
    paths:
      - ".github/workflows/audit-wallet-total.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-wallet-total.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Aggregate SAMS wallet balances
    runs-on: ubuntu-latest
    environment: production
    env:
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SSHPASS: ${{ secrets.HETZNER_PASSWORD }}

    steps:
      - name: Configure jump SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${OLD_HOST:?HETZNER_HOST is missing}"
          : "${OLD_USER:?HETZNER_USER is missing}"
          : "${OLD_PASSWORD:?HETZNER_PASSWORD is missing}"
          : "${NEW_HOST:?NEWHOST is missing}"
          : "${NEW_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is missing}"
          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" > ~/.ssh/known_hosts_legacy
          chmod 600 ~/.ssh/known_hosts_legacy
          cat > ~/.ssh/strato_proxy.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec sshpass -e ssh \
            -p "${OLD_PORT:-22}" \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_legacy" \
            -o ConnectTimeout=15 \
            -W "$1:$2" \
            "$OLD_USER@$OLD_HOST"
          SH
          chmod 700 ~/.ssh/strato_proxy.sh
          cat > ~/.ssh/config <<EOF
          Host sams-strato-via-legacy
              HostName $NEW_HOST
              User root
              IdentityFile ~/.ssh/strato_sams
              IdentitiesOnly yes
              ProxyCommand ~/.ssh/strato_proxy.sh %h %p
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts_strato
              ConnectTimeout 15
              ServerAliveInterval 10
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config
          timeout 30s ssh sams-strato-via-legacy 'echo STRATO_JUMP_SSH_OK'

      - name: Query aggregate wallet balances
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s ssh sams-strato-via-legacy "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          echo WALLET_TOTAL
          timeout 15s docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT COUNT(*), COALESCE(SUM(balance),0) FROM cards_wallet;"'
          echo BUSINESS_TOTALS
          timeout 15s docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT b.name,b.currency,COUNT(w.id),COALESCE(SUM(w.balance),0) FROM cards_business b LEFT JOIN cards_wallet w ON w.business_id=b.id GROUP BY b.id,b.name,b.currency ORDER BY b.id;"'
          echo STATUS_TOTALS
          timeout 15s docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT status,COUNT(*),COALESCE(SUM(balance),0) FROM cards_wallet GROUP BY status ORDER BY status;"'
          REMOTE
