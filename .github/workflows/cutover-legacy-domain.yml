name: Legacy App Compatibility Proxy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-legacy-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sams-cutover-legacy-domain
  cancel-in-progress: false

jobs:
  compatibility:
    name: Keep installed legacy mobile builds inside the app
    runs-on: ubuntu-latest
    environment: production
    env:
      LEGACY_DOMAIN: cards.smarbiz.sbs
      CANONICAL_DOMAIN: app.samsclublounge.de
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      APP_DIR: /root/apluscard

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${OLD_HOST:?HETZNER_HOST is missing}"
          : "${OLD_PASSWORD:?HETZNER_PASSWORD is missing}"
          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Replace legacy redirect with compatibility reverse proxy
        shell: bash
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "APP_DIR='$APP_DIR' LEGACY_DOMAIN='$LEGACY_DOMAIN' CANONICAL_DOMAIN='$CANONICAL_DOMAIN' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          SITE_LINK="/etc/nginx/sites-enabled/$LEGACY_DOMAIN"
          test -e "$SITE_LINK"
          SITE_FILE="$(readlink -f "$SITE_LINK")"
          test -f "$SITE_FILE"
          BACKUP="${SITE_FILE}.pre-compat-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$SITE_FILE" "$BACKUP"
          chmod --reference="$SITE_FILE" "$BACKUP"

          rollback() {
            status="${1:-1}"
            echo "LEGACY_COMPAT_ROLLBACK=YES status=$status" >&2
            set +e
            cp -a "$BACKUP" "$SITE_FILE"
            nginx -t >/dev/null 2>&1 && systemctl reload nginx
            cd "$APP_DIR"
            docker compose stop web push-worker >/dev/null 2>&1 || true
            exit 1
          }
          trap 'rollback $?' ERR

          cat > "$SITE_FILE" <<NGINX
          server {
              listen 443 ssl;
              listen [::]:443 ssl ipv6only=on;
              server_name $LEGACY_DOMAIN;

              ssl_certificate /etc/letsencrypt/live/$LEGACY_DOMAIN/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/$LEGACY_DOMAIN/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              location / {
                  proxy_pass https://$CANONICAL_DOMAIN;
                  proxy_http_version 1.1;
                  proxy_ssl_server_name on;
                  proxy_ssl_name $CANONICAL_DOMAIN;

                  proxy_set_header Host $LEGACY_DOMAIN;
                  proxy_set_header X-Forwarded-Host $LEGACY_DOMAIN;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";

                  proxy_redirect https://$CANONICAL_DOMAIN/ https://$LEGACY_DOMAIN/;
                  proxy_cookie_domain $CANONICAL_DOMAIN $LEGACY_DOMAIN;
                  proxy_read_timeout 90s;
              }
          }

          server {
              listen 80;
              listen [::]:80;
              server_name $LEGACY_DOMAIN;
              return 308 https://$LEGACY_DOMAIN\$request_uri;
          }
          NGINX

          nginx -t
          systemctl reload nginx

          # The legacy application and worker stay stopped. Only nginx proxies to
          # the canonical STRATO production, so there is still one writer/database.
          cd "$APP_DIR"
          docker compose stop web push-worker >/dev/null 2>&1 || true
          test -z "$(docker compose ps --status running -q web)"
          test -z "$(docker compose ps --status running -q push-worker)"

          trap - ERR
          echo "$BACKUP" > /root/.sams-legacy-nginx-pre-compat-backup
          echo "LEGACY_COMPAT_PROXY_INSTALLED=YES"
          REMOTE

      - name: Verify legacy URL stays on legacy host and serves canonical production
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="$(date +%s)"
          headers="$RUNNER_TEMP/legacy-headers.txt"
          body="$RUNNER_TEMP/legacy-body.json"
          code="$(curl --silent --show-error --max-time 25 \
            -H 'Cache-Control: no-cache' \
            -D "$headers" -o "$body" --write-out '%{http_code}' \
            "https://$LEGACY_DOMAIN/health/?compat=$stamp")"
          echo "Legacy compatibility health HTTP=$code"
          test "$code" = "200"
          grep -q '"status"' "$body"
          if awk 'BEGIN{IGNORECASE=1} /^location:[[:space:]]*https:\/\/app\.samsclublounge\.de/ {found=1} END{exit !found}' "$headers"; then
            echo "Legacy host still redirects to canonical domain." >&2
            exit 1
          fi

          canonical_code="$(curl --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' -o /dev/null --write-out '%{http_code}' \
            "https://$CANONICAL_DOMAIN/health/?canonical_check=$stamp")"
          test "$canonical_code" = "200"
          echo "LEGACY_APP_COMPATIBILITY_VERIFIED=YES"

      - name: Roll back proxy if public verification failed
        if: failure()
        shell: bash
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "APP_DIR='$APP_DIR' LEGACY_DOMAIN='$LEGACY_DOMAIN' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          SITE_FILE="$(readlink -f "/etc/nginx/sites-enabled/$LEGACY_DOMAIN")"
          MARKER=/root/.sams-legacy-nginx-pre-compat-backup
          if [ -s "$MARKER" ]; then
            BACKUP="$(cat "$MARKER")"
            if [ -f "$BACKUP" ]; then
              cp -a "$BACKUP" "$SITE_FILE"
              nginx -t
              systemctl reload nginx
            fi
          fi
          cd "$APP_DIR"
          docker compose stop web push-worker >/dev/null 2>&1 || true
          echo "LEGACY_COMPAT_PROXY_ROLLED_BACK=YES"
          REMOTE
          exit 1
