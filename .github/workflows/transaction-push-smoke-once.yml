name: Production Transaction Push Smoke Once

on:
  workflow_run:
    workflows: ["Test and Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sams-production-transaction-push-smoke-once
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      MARKER: /root/.sams-transaction-push-smoke-v1

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify canonical database and real transaction push path
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams root@"$SSH_HOST" \
            "APP_DIR='$APP_DIR' MARKER='$MARKER' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          if [ -f "$MARKER" ]; then
            echo "Production transaction push smoke already completed successfully."
            exit 0
          fi
          cd "$APP_DIR"

          test "$(docker compose ps --status running -q push-worker | wc -l)" -eq 1
          worker_cmd="$(docker compose exec -T push-worker python -c 'from pathlib import Path; print(Path("/proc/1/cmdline").read_bytes().replace(b"\0", b" ").decode())')"
          echo "Push worker PID 1: $worker_cmd"
          case "$worker_cmd" in
            *"manage.py run_push_worker"*) ;;
            *)
              echo "push-worker container is running the wrong process." >&2
              docker compose logs --tail=200 push-worker
              exit 1
              ;;
          esac

          docker compose exec -T web python manage.py shell -c '
          from django.db import connection
          assert connection.vendor == "postgresql", f"Production DB must be PostgreSQL, got {connection.vendor}"
          print(f"Canonical production DB OK · vendor={connection.vendor} · name={connection.settings_dict.get(chr(78)+chr(65)+chr(77)+chr(69))}")
          ' </dev/null

          set +e
          docker compose exec -T web python manage.py smoke_transaction_push </dev/null
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            echo "Transaction push smoke failed; collecting queue and worker diagnostics." >&2
            docker compose ps
            docker compose logs --tail=250 push-worker
            docker compose exec -T web python manage.py shell -c '
          from django.db.models import Count
          from cards.push_models import PushDelivery
          print("Push queue:", list(PushDelivery.objects.values("status").annotate(count=Count("id")).order_by("status")))
          print("Newest deliveries:", list(PushDelivery.objects.order_by("-created_at").values("id", "status", "attempts", "sent_count", "last_error")[:10]))
          ' </dev/null || true
            exit "$smoke_status"
          fi

          touch "$MARKER"
          chmod 600 "$MARKER"
          echo "One-time real transaction push smoke completed."
          REMOTE
