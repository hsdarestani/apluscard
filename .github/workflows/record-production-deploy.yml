name: Record Production Deploy

on:
  workflow_run:
    workflows: ["Activate STRATO Production"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir="$RUNNER_TEMP/apluscard-marker"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$workdir"
          cd "$workdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'commit=%s\ntime=%s\nworkflow_run=%s\n' "$DEPLOYED_SHA" "$DEPLOYED_AT" "${{ github.event.workflow_run.id }}" > .production-deployed
          git add .production-deployed
          git diff --cached --quiet || git commit -m "Record production deploy"
          git push origin HEAD:main
