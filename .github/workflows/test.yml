name: Test and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apluscard-production
  cancel-in-progress: true

jobs:
  django:
    name: Django tests
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - name: Record tested revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"
      - run: python manage.py test
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"

  deploy:
    name: Deploy to STRATO
    needs: django
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de
      STAGE_DOMAIN: new-app.samsclublounge.de
      LEGACY_DOMAIN: cards.smarbiz.sbs
      DEPLOY_SHA: ${{ needs.django.outputs.source_sha }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.django.outputs.source_sha }}
          fetch-depth: 1

      - name: Validate STRATO deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71" || {
            echo "Unexpected production host: $SSH_HOST"
            exit 1
          }
          test -n "$SSH_PRIVATE_KEY" || {
            echo "HETZNER_SSH_PRIVATE_KEY is missing"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package tested source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./media' \
            --exclude='./staticfiles' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            -czf "$RUNNER_TEMP/apluscard-release.tgz" .
          test -s "$RUNNER_TEMP/apluscard-release.tgz"

      - name: Upload tested source to STRATO
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/strato_sams -P "$SSH_PORT" \
            "$RUNNER_TEMP/apluscard-release.tgz" \
            "$SSH_USER@$SSH_HOST:/tmp/apluscard-release-$DEPLOY_SHA.tgz"

      - name: Deploy application to STRATO
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' SITE_DOMAIN='$SITE_DOMAIN' STAGE_DOMAIN='$STAGE_DOMAIN' LEGACY_DOMAIN='$LEGACY_DOMAIN' SSH_HOST='$SSH_HOST' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          release_archive="/tmp/apluscard-release-$DEPLOY_SHA.tgz"
          test -s "$release_archive"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          test -s .env

          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'media' \
            ! -name '.git' \
            -exec rm -rf {} +
          tar -xzf "$release_archive" -C "$APP_DIR"
          rm -f "$release_archive"
          printf '%s\n' "$DEPLOY_SHA" > "$APP_DIR/.deployed_sha"
          chmod 600 "$APP_DIR/.deployed_sha"

          export APP_DIR SITE_DOMAIN STAGE_DOMAIN LEGACY_DOMAIN SSH_HOST
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ["APP_DIR"]) / ".env"
          values = {}
          order = []
          passthrough = []
          for raw in env_path.read_text(encoding="utf-8").splitlines():
              if not raw.strip() or raw.lstrip().startswith("#") or "=" not in raw:
                  passthrough.append(raw)
                  continue
              key, value = raw.split("=", 1)
              key = key.strip()
              if key not in values:
                  order.append(key)
              values[key] = value

          site = os.environ["SITE_DOMAIN"]
          stage = os.environ["STAGE_DOMAIN"]
          legacy = os.environ["LEGACY_DOMAIN"]
          host = os.environ["SSH_HOST"]
          overrides = {
              "DJANGO_DEBUG": "0",
              "DJANGO_ALLOWED_HOSTS": f"{site},{stage},{legacy},{host},localhost,127.0.0.1",
              "DJANGO_CSRF_TRUSTED_ORIGINS": f"https://{site},https://{stage},https://{legacy}",
              "DJANGO_SECURE_COOKIES": "1",
              "DJANGO_HSTS_SECONDS": "31536000",
              "DEFAULT_BUSINESS_SLUG": "shisha-bar",
              "APP_NAME": "Sams Club Lounge",
              "APP_SHORT_NAME": "Sams Lounge",
              "APP_PUBLISHER": "A+ Solution GmbH",
              "APP_PUBLIC_BASE_URL": f"https://{site}",
              "ANDROID_PACKAGE_NAME": "de.aplussolution.samscard",
              "IOS_BUNDLE_ID": "de.aplussolution.samscard",
              "IOS_APP_TEAM_ID": "884MVA2MD5",
              "APPLE_BUNDLE_ID": "de.aplussolution.samscard",
              "APPLE_REDIRECT_URI": f"https://{site}/accounts/apple/callback/",
              "APNS_USE_SANDBOX": "0",
              "ALLOW_TEST_DATA_PURGE": "0",
              "WALLET_QR_MAX_AGE_SECONDS": "90",
              "WALLET_QR_REFRESH_SECONDS": "45",
          }
          values.update(overrides)
          for key in overrides:
              if key not in order:
                  order.append(key)

          rendered = []
          if passthrough:
              rendered.extend(passthrough)
          rendered.extend(f"{key}={values[key]}" for key in order)
          env_path.write_text("\n".join(rendered).rstrip() + "\n", encoding="utf-8")
          os.chmod(env_path, 0o600)
          PY

          docker compose up -d --build --remove-orphans
          docker compose exec -T web python manage.py migrate --noinput </dev/null
          docker compose exec -T web python manage.py check </dev/null

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=250 web
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Host: $SITE_DOMAIN" \
            http://127.0.0.1/health/ >/dev/null

          test "$(cat "$APP_DIR/.deployed_sha")" = "$DEPLOY_SHA"
          docker compose ps
          echo "STRATO deployment and health checks completed for $DEPLOY_SHA."
          REMOTE

      - name: Verify public UI release on primary production domain
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://$SITE_DOMAIN/health/" >/dev/null

          curl --fail --silent --show-error --max-time 30 \
            "https://$SITE_DOMAIN/accounts/login/?ui_check=20260807-2" \
            --output "$RUNNER_TEMP/site-login.html"
          grep -F 'name="sams-ui-release" content="20260807-2"' "$RUNNER_TEMP/site-login.html"
          grep -F '?v=20260807-2' "$RUNNER_TEMP/site-login.html"

          # The old smarbiz hostname is diagnostic only. Android/iOS and the web app
          # now load the primary app.samsclublounge.de origin.
          legacy_code="$(curl --silent --location --max-time 30 --output "$RUNNER_TEMP/legacy-login.html" --write-out '%{http_code}' \
            "https://$LEGACY_DOMAIN/accounts/login/?ui_check=20260807-2" || true)"
          echo "Legacy-domain HTTP status: $legacy_code"
          if grep -Fq 'name="sams-ui-release" content="20260807-2"' "$RUNNER_TEMP/legacy-login.html" 2>/dev/null; then
            echo "Legacy domain also serves the current UI release."
          else
            echo "Legacy domain is not authoritative for the current app UI."
          fi

          echo "UI release 20260807-2 is live on the primary production domain."
