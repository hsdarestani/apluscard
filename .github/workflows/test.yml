name: Test and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apluscard-production
  cancel-in-progress: true

jobs:
  django:
    name: Django tests + security + backup validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Validate Django configuration and migrations
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"
          PRIVILEGED_MFA_REQUIRED: "0"
          MFA_ENCRYPTION_KEY: "ci-only-mfa-encryption-key-not-for-production"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Audit Python dependencies and application code
        run: |
          python -m pip_audit -r requirements.txt
          bandit -r cards config -x 'cards/migrations,cards/test_*.py' -ll
      - name: Validate backup, restore and STRATO hardening scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n ops/backup/common.sh
          bash -n ops/backup/backup.sh
          bash -n ops/backup/restore-drill.sh
          bash -n ops/backup/restore-production.sh
          bash -n ops/security/harden-strato.sh
          shellcheck -x -S error \
            ops/backup/common.sh \
            ops/backup/backup.sh \
            ops/backup/restore-drill.sh \
            ops/backup/restore-production.sh \
            ops/security/harden-strato.sh
          grep -Fq 'RESTORE_PRODUCTION' ops/backup/restore-production.sh
          grep -Fq 'dropdb --force' ops/backup/restore-production.sh
          grep -Fq 'sha256sum -c SHA256SUMS' ops/backup/restore-production.sh
          grep -Fq 'pg_restore' ops/backup/restore-drill.sh
          grep -Fq 'verify_audit_chain' ops/backup/restore-drill.sh
          grep -Fq 'last-restore-drill.json' ops/backup/restore-drill.sh
          grep -Fq 'rclone:*)' ops/backup/common.sh
          grep -Fq 's3:*)' ops/backup/common.sh
          grep -Fq 'BACKUP_RCLONE_CONFIG_BASE64' .github/workflows/configure-production-backups.yml
          grep -Fq 'apt-get install -y restic rclone jq' .github/workflows/configure-production-backups.yml
          grep -Fq 'PasswordAuthentication no' ops/security/harden-strato.sh
          grep -Fq 'PermitRootLogin prohibit-password' ops/security/harden-strato.sh
          grep -Fq 'ufw default deny incoming' ops/security/harden-strato.sh
          grep -Fq 'fail2ban' ops/security/harden-strato.sh
          grep -Fq 'unattended-upgrades' ops/security/harden-strato.sh
          grep -Fq 'auditd' ops/security/harden-strato.sh
      - name: Apply migrations on SQLite
        run: python manage.py migrate --noinput
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"
          PRIVILEGED_MFA_REQUIRED: "0"
          MFA_ENCRYPTION_KEY: "ci-only-mfa-encryption-key-not-for-production"
      - name: Run complete Django test suite
        run: python manage.py test
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"
          PRIVILEGED_MFA_REQUIRED: "0"
          MFA_ENCRYPTION_KEY: "ci-only-mfa-encryption-key-not-for-production"

  deploy:
    name: Deploy to STRATO
    needs: django
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      MFA_ENCRYPTION_KEY_INPUT: ${{ secrets.MFA_ENCRYPTION_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de
      STAGE_DOMAIN: new-app.samsclublounge.de
      LEGACY_DOMAIN: cards.smarbiz.sbs

    steps:
      - name: Validate STRATO deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71" || {
            echo "Unexpected production host: $SSH_HOST"
            exit 1
          }
          test -n "$SSH_PRIVATE_KEY" || {
            echo "HETZNER_SSH_PRIVATE_KEY is missing"
            exit 1
          }
          test "${#MFA_ENCRYPTION_KEY_INPUT}" -ge 32 || {
            echo "MFA_ENCRYPTION_KEY is missing or shorter than 32 characters"
            exit 1
          }

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer dedicated MFA encryption key
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          KEY_PAYLOAD="$RUNNER_TEMP/mfa-encryption-key.payload"
          printf '%s' "$MFA_ENCRYPTION_KEY_INPUT" > "$KEY_PAYLOAD"
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/strato_sams -P "$SSH_PORT" "$KEY_PAYLOAD" "$SSH_USER@$SSH_HOST:$APP_DIR/.mfa-encryption-key.payload"

      - name: Deploy application to STRATO
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' SITE_DOMAIN='$SITE_DOMAIN' STAGE_DOMAIN='$STAGE_DOMAIN' LEGACY_DOMAIN='$LEGACY_DOMAIN' SSH_HOST='$SSH_HOST' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          test -d .git
          test -s .env
          test -s .mfa-encryption-key.payload

          git fetch --prune origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          export APP_DIR SITE_DOMAIN STAGE_DOMAIN LEGACY_DOMAIN SSH_HOST
          python3 - <<'PY'
          import os
          from pathlib import Path

          app_dir = Path(os.environ["APP_DIR"])
          env_path = app_dir / ".env"
          mfa_key_path = app_dir / ".mfa-encryption-key.payload"
          mfa_key = mfa_key_path.read_text(encoding="utf-8").strip()
          if len(mfa_key) < 32:
              raise SystemExit("MFA encryption key is missing or too short")

          values = {}
          order = []
          passthrough = []
          for raw in env_path.read_text(encoding="utf-8").splitlines():
              if not raw.strip() or raw.lstrip().startswith("#") or "=" not in raw:
                  passthrough.append(raw)
                  continue
              key, value = raw.split("=", 1)
              key = key.strip()
              if key not in values:
                  order.append(key)
              values[key] = value

          site = os.environ["SITE_DOMAIN"]
          stage = os.environ["STAGE_DOMAIN"]
          legacy = os.environ["LEGACY_DOMAIN"]
          host = os.environ["SSH_HOST"]
          overrides = {
              "DJANGO_DEBUG": "0",
              "DJANGO_ALLOWED_HOSTS": f"{site},{stage},{legacy},{host},localhost,127.0.0.1",
              "DJANGO_CSRF_TRUSTED_ORIGINS": f"https://{site},https://{stage},https://{legacy}",
              "DJANGO_SECURE_COOKIES": "1",
              "DJANGO_HSTS_SECONDS": "31536000",
              "DEFAULT_BUSINESS_SLUG": "shisha-bar",
              "APP_NAME": "Sams Club Lounge",
              "APP_SHORT_NAME": "Sams Lounge",
              "APP_PUBLISHER": "A+ Solution GmbH",
              "APP_PUBLIC_BASE_URL": f"https://{site}",
              "ANDROID_PACKAGE_NAME": "de.aplussolution.samscard",
              "IOS_BUNDLE_ID": "de.aplussolution.samscard",
              "IOS_APP_TEAM_ID": "884MVA2MD5",
              "APPLE_BUNDLE_ID": "de.aplussolution.samscard",
              "APPLE_REDIRECT_URI": f"https://{site}/accounts/apple/callback/",
              "APNS_USE_SANDBOX": "0",
              "ALLOW_TEST_DATA_PURGE": "0",
              "WALLET_QR_MAX_AGE_SECONDS": "90",
              "WALLET_QR_REFRESH_SECONDS": "45",
              "PRIVILEGED_MFA_REQUIRED": "1",
              "PRIVILEGED_MFA_SESSION_SECONDS": "43200",
              "MFA_ENCRYPTION_KEY": mfa_key,
          }
          values.update(overrides)
          for key in overrides:
              if key not in order:
                  order.append(key)

          rendered = []
          if passthrough:
              rendered.extend(passthrough)
          rendered.extend(f"{key}={values[key]}" for key in order)
          env_path.write_text("\n".join(rendered).rstrip() + "\n", encoding="utf-8")
          os.chmod(env_path, 0o600)
          mfa_key_path.unlink(missing_ok=True)
          PY

          docker compose up -d --build --remove-orphans
          docker compose exec -T web python manage.py migrate --noinput </dev/null
          docker compose exec -T web python manage.py check </dev/null
          docker compose exec -T web python manage.py verify_audit_chain </dev/null

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=250 web
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Host: $SITE_DOMAIN" \
            http://127.0.0.1/health/ >/dev/null

          docker compose ps
          echo "STRATO deployment, migrations, MFA and audit integrity checks completed."
          REMOTE

      - name: Verify public production endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://$SITE_DOMAIN/health/" >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            "https://$SITE_DOMAIN/accounts/login/" >/dev/null
          echo "Public production endpoint is healthy."
