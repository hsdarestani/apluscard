name: Diagnose active iOS signing certificate once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ios-signing-cert-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    environment: production
    env:
      IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64_V2 }}
    steps:
      - name: Print non-secret signing certificate metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          P12="$RUNNER_TEMP/current.p12"
          CERT="$RUNNER_TEMP/current.pem"
          PROFILE="$RUNNER_TEMP/ext.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ext.plist"
          EXT_CERT_DER="$RUNNER_TEMP/ext-cert.der"

          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -D > "$P12"
          openssl pkcs12 -in "$P12" -passin "pass:$IOS_DISTRIBUTION_CERT_PASSWORD" -clcerts -nokeys -out "$CERT"
          echo '=== ACTIVE P12 CERTIFICATE ==='
          openssl x509 -in "$CERT" -noout -subject -serial -dates -fingerprint -sha1

          printf '%s' "$IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          python3 - "$PROFILE_PLIST" "$EXT_CERT_DER" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              profile = plistlib.load(handle)
          certs = profile.get('DeveloperCertificates') or []
          if not certs:
              raise SystemExit('No DeveloperCertificates in extension profile')
          with open(sys.argv[2], 'wb') as handle:
              handle.write(bytes(certs[0]))
          print('Profile name:', profile.get('Name'))
          print('Profile UUID:', profile.get('UUID'))
          print('Profile App ID:', (profile.get('Entitlements') or {}).get('application-identifier'))
          PY
          echo '=== EXTENSION PROFILE CERTIFICATE ==='
          openssl x509 -inform DER -in "$EXT_CERT_DER" -noout -subject -serial -dates -fingerprint -sha1
