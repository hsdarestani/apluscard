name: Restore api.apluscard.de Compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-apluscard-api-compat.yml"
      - "deploy/nginx/api.apluscard.de.conf"
      - ".env.example"
      - "deploy/Caddyfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apluscard-api-compat
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      EXPECTED_HOST: 217.160.50.71
      APP_DIR: /root/apluscard
      LEGACY_DOMAIN: api.apluscard.de

    steps:
      - name: Checkout compatibility config
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            deploy/nginx/api.apluscard.de.conf
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "$EXPECTED_HOST" || { echo "Unexpected production host: $SSH_HOST"; exit 1; }
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/apluscard_prod
          chmod 600 ~/.ssh/apluscard_prod
          ssh-keygen -y -f ~/.ssh/apluscard_prod >/dev/null
          ssh-keyscan -t ed25519 -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compatibility nginx config
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/apluscard_prod deploy/nginx/api.apluscard.de.conf root@"$SSH_HOST":/tmp/api.apluscard.de.conf

      - name: Install compatibility host on production
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/apluscard_prod root@"$SSH_HOST" \
            "APP_DIR='$APP_DIR' LEGACY_DOMAIN='$LEGACY_DOMAIN' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          test -s .env
          test -s /tmp/api.apluscard.de.conf

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/root/apluscard/.env")
          raw_lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          seen = set()

          additions = {
              "DJANGO_ALLOWED_HOSTS": "api.apluscard.de",
              "DJANGO_CSRF_TRUSTED_ORIGINS": "https://api.apluscard.de",
          }

          for raw in raw_lines:
              if "=" not in raw or raw.lstrip().startswith("#"):
                  output.append(raw)
                  continue
              key, value = raw.split("=", 1)
              key = key.strip()
              if key not in additions:
                  output.append(raw)
                  continue
              items = [x.strip() for x in value.split(",") if x.strip()]
              if additions[key] not in items:
                  items.append(additions[key])
              output.append(f"{key}={','.join(items)}")
              seen.add(key)

          for key, value in additions.items():
              if key not in seen:
                  output.append(f"{key}={value}")

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY

          install -m 644 /tmp/api.apluscard.de.conf /etc/nginx/sites-available/api.apluscard.de
          rm -f /tmp/api.apluscard.de.conf
          ln -sfn /etc/nginx/sites-available/api.apluscard.de /etc/nginx/sites-enabled/api.apluscard.de
          nginx -t
          systemctl reload nginx

          # Recreate only app containers from the existing image so updated env is loaded.
          # Do not rebuild the image and do not touch the database container.
          docker compose up -d --no-build --force-recreate --no-deps web

          # The worker does not need the host alias env, but recover it if the
          # previous compose recreate left it stopped.
          if docker ps -a --format '{{.Names}}' | grep -qx 'apluscard-push-worker-1'; then
            docker start apluscard-push-worker-1 >/dev/null || true
          else
            docker compose up -d --no-build --no-deps push-worker
          fi
          test "$(docker inspect -f '{{.State.Running}}' apluscard-push-worker-1 2>/dev/null || echo false)" = "true"

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error -H "Host: api.apluscard.de" http://127.0.0.1:8010/health/ >/dev/null; then
              break
            fi
            test "$attempt" -lt 45 || { docker compose ps; docker compose logs --tail=120 web; exit 1; }
            sleep 2
          done

          apt-get update >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-nginx >/dev/null
          certbot --nginx \
            --domain "$LEGACY_DOMAIN" \
            --non-interactive \
            --agree-tos \
            --email aplus.solutiongmbh@icloud.com \
            --redirect \
            --keep-until-expiring

          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify legacy host publicly
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            body="$RUNNER_TEMP/health.json"
            code="$(curl --silent --show-error --max-time 20 -o "$body" --write-out '%{http_code}' "https://$LEGACY_DOMAIN/health/" || true)"
            if [ "$code" = "200" ] && grep -q '"status"' "$body"; then
              echo "LEGACY_API_COMPAT_OK=YES"
              exit 0
            fi
            echo "Attempt $attempt: HTTP=$code"
            sleep 4
          done
          echo "Legacy API compatibility check failed."
          exit 1
