name: Configure Production Backups

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: apluscard-production-backup-config
  cancel-in-progress: false

jobs:
  configure:
    name: STRATO Offsite-Backup einrichten und Restore testen
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      RESTIC_REPOSITORY_INPUT: ${{ secrets.BACKUP_RESTIC_REPOSITORY }}
      RESTIC_PASSWORD_INPUT: ${{ secrets.BACKUP_RESTIC_PASSWORD }}
      RCLONE_CONFIG_BASE64_INPUT: ${{ secrets.BACKUP_RCLONE_CONFIG_BASE64 }}
      AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION_INPUT: ${{ secrets.BACKUP_AWS_DEFAULT_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: STRATO- und Backup-Secrets prüfen
        id: backup-payload
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71" || (echo "Unerwarteter Production-Host: $SSH_HOST" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "HETZNER_SSH_PRIVATE_KEY fehlt." && exit 1)
          test -n "$RESTIC_REPOSITORY_INPUT" || (echo "BACKUP_RESTIC_REPOSITORY fehlt." && exit 1)
          test -n "$RESTIC_PASSWORD_INPUT" || (echo "BACKUP_RESTIC_PASSWORD fehlt." && exit 1)
          test "${#RESTIC_PASSWORD_INPUT}" -ge 24 || (echo "BACKUP_RESTIC_PASSWORD muss mindestens 24 Zeichen lang sein." && exit 1)

          case "$RESTIC_REPOSITORY_INPUT" in
            rclone:*)
              test -n "$RCLONE_CONFIG_BASE64_INPUT" || (echo "BACKUP_RCLONE_CONFIG_BASE64 fehlt." && exit 1)
              PROVIDER="Google Drive über rclone"
              ;;
            s3:*)
              test -n "$AWS_ACCESS_KEY_ID_INPUT" || (echo "BACKUP_AWS_ACCESS_KEY_ID fehlt." && exit 1)
              test -n "$AWS_SECRET_ACCESS_KEY_INPUT" || (echo "BACKUP_AWS_SECRET_ACCESS_KEY fehlt." && exit 1)
              PROVIDER="S3-kompatibler Object Storage"
              ;;
            *)
              echo "BACKUP_RESTIC_REPOSITORY muss mit rclone: oder s3: beginnen."
              exit 1
              ;;
          esac

          umask 077
          SSH_KEY_FILE="$RUNNER_TEMP/strato_sams"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          ssh-keygen -y -f "$SSH_KEY_FILE" >/dev/null

          PAYLOAD_FILE="$RUNNER_TEMP/apluscard-backup.payload"
          {
            printf 'RESTIC_REPOSITORY_B64=%s\n' "$(printf '%s' "$RESTIC_REPOSITORY_INPUT" | base64 -w0)"
            printf 'RESTIC_PASSWORD_B64=%s\n' "$(printf '%s' "$RESTIC_PASSWORD_INPUT" | base64 -w0)"
            printf 'RCLONE_CONFIG_SECRET_B64=%s\n' "$(printf '%s' "$RCLONE_CONFIG_BASE64_INPUT" | base64 -w0)"
            printf 'AWS_ACCESS_KEY_ID_B64=%s\n' "$(printf '%s' "$AWS_ACCESS_KEY_ID_INPUT" | base64 -w0)"
            printf 'AWS_SECRET_ACCESS_KEY_B64=%s\n' "$(printf '%s' "$AWS_SECRET_ACCESS_KEY_INPUT" | base64 -w0)"
            printf 'AWS_DEFAULT_REGION_B64=%s\n' "$(printf '%s' "${AWS_DEFAULT_REGION_INPUT:-auto}" | base64 -w0)"
          } > "$PAYLOAD_FILE"
          chmod 600 "$PAYLOAD_FILE"
          echo "ssh_key_file=$SSH_KEY_FILE" >> "$GITHUB_OUTPUT"
          echo "payload_file=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: STRATO-Hostschlüssel prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -t ed25519 -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Geschützte Backup-Konfiguration übertragen
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="${{ steps.backup-payload.outputs.ssh_key_file }}"
          ssh -i "$KEY" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR'"
          scp -i "$KEY" -P "$SSH_PORT" "${{ steps.backup-payload.outputs.payload_file }}" "$SSH_USER@$SSH_HOST:$APP_DIR/.backup-secrets.payload"

      - name: Timer installieren, erstes Backup und Restore-Drill ausführen
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="${{ steps.backup-payload.outputs.ssh_key_file }}"
          ssh -i "$KEY" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          git fetch --prune origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          test -f .backup-secrets.payload || (echo "Backup-Payload fehlt." && exit 1)
          . ./.backup-secrets.payload

          decode_value() {
            if [[ -n "${1:-}" ]]; then
              printf '%s' "$1" | base64 --decode
            fi
          }

          RESTIC_REPOSITORY_VALUE="$(decode_value "$RESTIC_REPOSITORY_B64")"
          RESTIC_PASSWORD_VALUE="$(decode_value "$RESTIC_PASSWORD_B64")"
          RCLONE_CONFIG_BASE64_VALUE="$(decode_value "$RCLONE_CONFIG_SECRET_B64")"
          AWS_ACCESS_KEY_ID_VALUE="$(decode_value "$AWS_ACCESS_KEY_ID_B64")"
          AWS_SECRET_ACCESS_KEY_VALUE="$(decode_value "$AWS_SECRET_ACCESS_KEY_B64")"
          AWS_DEFAULT_REGION_VALUE="$(decode_value "$AWS_DEFAULT_REGION_B64")"

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y restic rclone jq

          RCLONE_CONFIG_FILE="/root/.config/rclone/rclone.conf"
          if [[ "$RESTIC_REPOSITORY_VALUE" == rclone:* ]]; then
            test -n "$RCLONE_CONFIG_BASE64_VALUE" || (echo "Rclone-Konfiguration fehlt." && exit 1)
            install -m 700 -d "$(dirname "$RCLONE_CONFIG_FILE")"
            printf '%s' "$RCLONE_CONFIG_BASE64_VALUE" | base64 --decode > "$RCLONE_CONFIG_FILE"
            chmod 600 "$RCLONE_CONFIG_FILE"
            REMOTE_SPEC="${RESTIC_REPOSITORY_VALUE#rclone:}"
            REMOTE_NAME="${REMOTE_SPEC%%:*}"
            test -n "$REMOTE_NAME" || (echo "Rclone-Remote fehlt im Repository-Pfad." && exit 1)
            rclone --config "$RCLONE_CONFIG_FILE" listremotes | grep -Fxq "${REMOTE_NAME}:"
            rclone --config "$RCLONE_CONFIG_FILE" lsf "${REMOTE_NAME}:" --max-depth 1 >/dev/null
          fi

          umask 077
          BACKUP_ENV_TEMP="$(mktemp)"
          {
            printf 'RESTIC_REPOSITORY=%q\n' "$RESTIC_REPOSITORY_VALUE"
            printf 'RESTIC_PASSWORD=%q\n' "$RESTIC_PASSWORD_VALUE"
            printf 'RESTIC_CACHE_DIR=%q\n' "/var/cache/restic"
            printf 'BACKUP_HOST_TAG=%q\n' "apluscard-strato-production"
            if [[ "$RESTIC_REPOSITORY_VALUE" == rclone:* ]]; then
              printf 'RCLONE_CONFIG=%q\n' "$RCLONE_CONFIG_FILE"
            else
              printf 'AWS_ACCESS_KEY_ID=%q\n' "$AWS_ACCESS_KEY_ID_VALUE"
              printf 'AWS_SECRET_ACCESS_KEY=%q\n' "$AWS_SECRET_ACCESS_KEY_VALUE"
              printf 'AWS_DEFAULT_REGION=%q\n' "${AWS_DEFAULT_REGION_VALUE:-auto}"
            fi
          } > "$BACKUP_ENV_TEMP"
          chmod 600 "$BACKUP_ENV_TEMP"
          mv "$BACKUP_ENV_TEMP" .backup.env
          rm -f .backup-secrets.payload

          chmod 700 ops/backup/common.sh ops/backup/backup.sh ops/backup/restore-drill.sh ops/backup/restore-production.sh
          install -m 644 ops/backup/systemd/apluscard-backup.service /etc/systemd/system/apluscard-backup.service
          install -m 644 ops/backup/systemd/apluscard-backup.timer /etc/systemd/system/apluscard-backup.timer
          install -m 644 ops/backup/systemd/apluscard-restore-drill.service /etc/systemd/system/apluscard-restore-drill.service
          install -m 644 ops/backup/systemd/apluscard-restore-drill.timer /etc/systemd/system/apluscard-restore-drill.timer
          mkdir -p /var/lib/apluscard-backup /var/cache/restic
          chmod 700 /var/lib/apluscard-backup /var/cache/restic

          systemctl daemon-reload
          systemctl enable --now apluscard-backup.timer apluscard-restore-drill.timer
          systemctl start apluscard-backup.service
          systemctl --quiet is-failed apluscard-backup.service && {
            journalctl -u apluscard-backup.service --no-pager -n 150
            exit 1
          }
          systemctl start apluscard-restore-drill.service
          systemctl --quiet is-failed apluscard-restore-drill.service && {
            journalctl -u apluscard-restore-drill.service --no-pager -n 150
            exit 1
          }

          jq -e '.status == "success"' /var/lib/apluscard-backup/last-backup.json >/dev/null
          jq -e '.status == "success"' /var/lib/apluscard-backup/last-restore-drill.json >/dev/null
          systemctl list-timers apluscard-backup.timer apluscard-restore-drill.timer --no-pager
          echo "STRATO-Backup, Audit-Export und echter Restore-Drill waren erfolgreich."
          REMOTE

      - name: Backup-Status veröffentlichen
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BACKUP_JOB_STATUS: ${{ job.status }}
          BACKUP_PROVIDER: ${{ steps.backup-payload.outputs.provider }}
        with:
          script: |
            const success = process.env.BACKUP_JOB_STATUS === 'success';
            const provider = process.env.BACKUP_PROVIDER || 'nicht erkannt';
            const lines = success ? [
              '# Production Backup & Disaster Recovery Status',
              '',
              '✅ **Active and restore-tested on STRATO**',
              '',
              '- PostgreSQL, media and encrypted production configuration are backed up every six hours.',
              '- The sealed audit chain is verified and exported as canonical JSONL before every snapshot.',
              `- Offsite destination: ${provider}`,
              '- Restic encrypts data before it leaves the server.',
              '- Weekly restore drill validates checksums, database restore and the complete audit hash chain.',
              '- Retention: 7-day window, 30 daily, 12 weekly, 12 monthly and 3 yearly snapshots.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ] : [
              '# Production Backup & Disaster Recovery Status',
              '',
              '❌ **Setup or restore drill failed**',
              '',
              `- Requested destination: ${provider}`,
              '- No secret values were included in this report.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ];
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 25,
                body: lines.join('\n'),
              });
            } catch (error) {
              core.warning(`Could not update status issue: ${error.message}`);
            }
