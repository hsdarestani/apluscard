name: Verify SAMS Landing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sams-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public landing content
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$RUNNER_TEMP/landing.html"
          headers="$RUNNER_TEMP/landing.headers"
          curl --fail --silent --show-error --location --max-time 30 \
            -D "$headers" \
            "https://samsclublounge.de/" \
            -o "$body"

          echo '--- RESPONSE HEADERS ---'
          sed -n '1,30p' "$headers"
          echo '--- PUBLIC PAGE TITLE ---'
          grep -io '<title[^>]*>[^<]*</title>' "$body" | head -n 1 || true
          echo '--- CONTENT MARKERS ---'
          for marker in 'Drei Standorte' 'App Store' 'Google Play' 'Dein Abend'; do
            if grep -q "$marker" "$body"; then echo "FOUND: $marker"; else echo "MISSING: $marker"; fi
          done

          grep -q 'Drei Standorte' "$body"
          grep -q 'App Store' "$body"
          grep -q 'Google Play' "$body"
          echo 'PUBLIC_LANDING_ACTIVE'
