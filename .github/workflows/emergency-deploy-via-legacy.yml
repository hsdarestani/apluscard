name: Emergency Deploy STRATO via Legacy Jump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-deploy-via-legacy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sams-emergency-strato-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy current main through legacy SSH jump
    runs-on: ubuntu-latest
    environment: production
    env:
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de
      SSHPASS: ${{ secrets.HETZNER_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate target and prepare jump SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$NEW_HOST" = "217.160.50.71" || { echo "Unexpected STRATO host: $NEW_HOST"; exit 1; }
          test -n "$NEW_PRIVATE_KEY"
          test -n "$OLD_HOST"
          test -n "$OLD_PASSWORD"

          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" > ~/.ssh/known_hosts_legacy
          chmod 600 ~/.ssh/known_hosts_legacy

          cat > ~/.ssh/strato_proxy.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec sshpass -e ssh \
            -p "${OLD_PORT:-22}" \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_legacy" \
            -o ConnectTimeout=15 \
            -W "$1:$2" \
            "$OLD_USER@$OLD_HOST"
          SH
          chmod 700 ~/.ssh/strato_proxy.sh

          cat > ~/.ssh/config <<EOF
          Host sams-strato-via-legacy
              HostName $NEW_HOST
              User root
              IdentityFile ~/.ssh/strato_sams
              IdentitiesOnly yes
              ProxyCommand ~/.ssh/strato_proxy.sh %h %p
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts_strato
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          ssh sams-strato-via-legacy 'echo STRATO_JUMP_SSH_OK'

      - name: Package current source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./media' \
            --exclude='./staticfiles' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            -czf "$RUNNER_TEMP/apluscard-emergency-release.tgz" .
          test -s "$RUNNER_TEMP/apluscard-emergency-release.tgz"

      - name: Upload release through legacy jump
        shell: bash
        run: |
          set -Eeuo pipefail
          scp "$RUNNER_TEMP/apluscard-emergency-release.tgz" \
            "sams-strato-via-legacy:/tmp/apluscard-emergency-${{ steps.source.outputs.sha }}.tgz"

      - name: Deploy and verify services on STRATO
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh sams-strato-via-legacy \
            "APP_DIR='$APP_DIR' DEPLOY_SHA='${{ steps.source.outputs.sha }}' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          release_archive="/tmp/apluscard-emergency-$DEPLOY_SHA.tgz"
          test -s "$release_archive"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          test -s .env

          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'media' \
            ! -name '.git' \
            -exec rm -rf {} +
          tar -xzf "$release_archive" -C "$APP_DIR"
          rm -f "$release_archive"

          docker compose up -d --build --remove-orphans
          docker compose exec -T web python manage.py migrate --noinput </dev/null
          docker compose exec -T web python manage.py check </dev/null

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=250 web
            exit 1
          fi

          test "$(docker compose ps --status running -q web | wc -l)" -eq 1
          test "$(docker compose ps --status running -q push-worker | wc -l)" -eq 1
          printf '%s\n' "$DEPLOY_SHA" > "$APP_DIR/.deployed_sha.tmp"
          chmod 600 "$APP_DIR/.deployed_sha.tmp"
          mv "$APP_DIR/.deployed_sha.tmp" "$APP_DIR/.deployed_sha"
          docker compose ps
          echo "EMERGENCY_STRATO_DEPLOY_OK=$DEPLOY_SHA"
          REMOTE

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 30 "https://$SITE_DOMAIN/health/" >/dev/null
          echo "PUBLIC_PRODUCTION_HEALTH_OK=YES"
