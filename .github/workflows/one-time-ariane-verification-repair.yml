name: One-time Ariane verification repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ariane-verification-repair.yml

permissions:
  contents: read

jobs:
  repair:
    name: Inspect and repair production verification
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
    steps:
      - name: Validate production target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          test -n "$SSH_PRIVATE_KEY"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -t ed25519 -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect and repair Ariane verification state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          docker compose exec -T web python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.utils import timezone
          from cards.models import MemberProfile
          from cards.email_verification_models import EmailVerificationAttempt

          EMAIL = "ariane_r@hotmail.de"
          User = get_user_model()
          user = User.objects.filter(email__iexact=EMAIL).first()
          if user is None:
              raise SystemExit("ARIANE_DIAG user_not_found")

          profile = MemberProfile.objects.filter(user=user).first()
          if profile is None:
              raise SystemExit(f"ARIANE_DIAG user_id={user.pk} profile_not_found")

          attempts = list(
              EmailVerificationAttempt.objects.filter(user=user)
              .order_by("-created_at")[:8]
          )
          print(
              "ARIANE_BEFORE",
              f"user_id={user.pk}",
              f"verified={profile.email_verified}",
              f"verified_at={profile.email_verified_at}",
              f"attempt_count={len(attempts)}",
          )
          for attempt in attempts:
              print(
                  "ARIANE_ATTEMPT",
                  f"id={attempt.pk}",
                  f"status={attempt.status}",
                  f"trigger={attempt.trigger}",
                  f"created={attempt.created_at}",
                  f"accepted={attempt.accepted_at}",
                  f"clicked={attempt.clicked_at}",
                  f"confirmed={attempt.confirmed_at}",
                  f"click_count={attempt.click_count}",
                  f"error_class={attempt.error_class}",
              )

          now = timezone.now()
          if not profile.email_verified:
              profile.email_verified = True
              profile.email_verified_at = now
              profile.save(update_fields=["email_verified", "email_verified_at"])
              if attempts:
                  latest = attempts[0]
                  latest.status = EmailVerificationAttempt.Status.CONFIRMED
                  latest.confirmed_at = latest.confirmed_at or now
                  latest.error_class = ""
                  latest.error_detail = ""
                  latest.save(
                      update_fields=[
                          "status",
                          "confirmed_at",
                          "error_class",
                          "error_detail",
                          "updated_at",
                      ]
                  )
              print("ARIANE_ACTION forced_verified=true")
          else:
              print("ARIANE_ACTION already_verified=true")

          profile.refresh_from_db()
          print(
              "ARIANE_AFTER",
              f"verified={profile.email_verified}",
              f"verified_at={profile.email_verified_at}",
          )
          PY
          REMOTE
