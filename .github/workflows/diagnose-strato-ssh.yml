name: Diagnose STRATO SSH Rate Limit

on:
  push:
    branches: [diagnose-strato-ssh-20260808]
    paths:
      - ".github/workflows/diagnose-strato-ssh.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      SSHPASS: ${{ secrets.HETZNER_PASSWORD }}

    steps:
      - name: Prepare read-only diagnostic access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$NEW_HOST" = "217.160.50.71"
          test -n "$NEW_PRIVATE_KEY"
          test -n "$OLD_HOST"
          test -n "$OLD_PASSWORD"

          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null

          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" > ~/.ssh/known_hosts_legacy
          chmod 600 ~/.ssh/known_hosts_legacy

          cat > ~/.ssh/strato_proxy.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec sshpass -e ssh \
            -p "${OLD_PORT:-22}" \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_legacy" \
            -o ConnectTimeout=15 \
            -W "$1:$2" \
            "$OLD_USER@$OLD_HOST"
          SH
          chmod 700 ~/.ssh/strato_proxy.sh

          runner_ip="$(curl -fsS --max-time 10 https://api.ipify.org || true)"
          echo "RUNNER_PUBLIC_IP=$runner_ip"
          echo "RUNNER_PUBLIC_IP=$runner_ip" >> "$GITHUB_ENV"

      - name: Direct SSH before any STRATO keyscan
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$NEW_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo 'DIRECT_SSH_BEFORE_SCAN=YES'
          echo '--- UFW STATUS ---'
          ufw status verbose || true
          echo '--- UFW NUMBERED ---'
          ufw status numbered || true
          echo '--- FAIL2BAN SSHD ---'
          fail2ban-client status sshd || true
          echo '--- SSHD EFFECTIVE ---'
          sshd -T | grep -E '^(maxstartups|maxauthtries|logingracetime|passwordauthentication|kbdinteractiveauthentication|permitrootlogin|pubkeyauthentication) ' || true
          REMOTE

      - name: Clear rate window before reproduction
        run: sleep 35

      - name: Reproduce five-keyscan then real SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/strato_keyscan /tmp/direct_after_scan
          set +e
          ssh-keyscan -H -T 8 "$NEW_HOST" > /tmp/strato_keyscan 2>&1
          keyscan_rc=$?
          set -e
          echo "KEYSCAN_RC=$keyscan_rc"
          grep -c 'SSH-2.0-OpenSSH' /tmp/strato_keyscan || true
          cat /tmp/strato_keyscan

          set +e
          timeout 20 ssh -i ~/.ssh/strato_sams \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 \
            root@"$NEW_HOST" 'echo DIRECT_SSH_AFTER_SCAN=YES' \
            > /tmp/direct_after_scan 2>&1
          direct_rc=$?
          set -e
          echo "DIRECT_AFTER_SCAN_RC=$direct_rc"
          cat /tmp/direct_after_scan

      - name: Inspect STRATO through legacy path after direct lockout
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ProxyCommand='~/.ssh/strato_proxy.sh %h %p' \
            root@"$NEW_HOST" "RUNNER_PUBLIC_IP='$RUNNER_PUBLIC_IP' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          echo 'JUMP_SSH_AFTER_DIRECT_LOCKOUT=YES'
          echo '--- FAIL2BAN SSHD AFTER REPRO ---'
          fail2ban-client status sshd || true
          echo '--- UFW STATUS AFTER REPRO ---'
          ufw status numbered || true
          echo '--- UFW KERNEL LOGS (RECENT) ---'
          journalctl -k --since '3 minutes ago' --no-pager | grep -E 'UFW|LIMIT|BLOCK' | tail -n 120 || true
          echo '--- SSH LOGS (RECENT) ---'
          journalctl -u ssh --since '3 minutes ago' --no-pager | tail -n 160 || true
          echo "RUNNER_PUBLIC_IP_SEEN=$RUNNER_PUBLIC_IP"
          REMOTE

      - name: Check direct SSH after UFW window expires
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 40
          set +e
          timeout 20 ssh -i ~/.ssh/strato_sams \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 \
            root@"$NEW_HOST" 'echo DIRECT_SSH_AFTER_40S=YES' \
            > /tmp/direct_after_40s 2>&1
          rc=$?
          set -e
          echo "DIRECT_AFTER_40S_RC=$rc"
          cat /tmp/direct_after_40s
