name: Verify STRATO Single-Keyscan Path

on:
  push:
    branches: [diagnose-strato-ssh-20260808]
    paths:
      - ".github/workflows/diagnose-strato-ssh.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de

    steps:
      - name: Configure SSH with one host-key connection
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -t ed25519 -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare production revision
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams root@"$SSH_HOST" \
            "test -s '$APP_DIR/.deployed_sha' && cat '$APP_DIR/.deployed_sha'"

      - name: Verify production services and fail2ban state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams root@"$SSH_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          docker compose exec -T web python manage.py check </dev/null
          test "$(docker compose ps --status running -q web | wc -l)" -eq 1
          test "$(docker compose ps --status running -q push-worker | wc -l)" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null
          fail2ban-client status sshd
          REMOTE
          curl --fail --silent --show-error --max-time 30 "https://$SITE_DOMAIN/health/" >/dev/null
          echo "SINGLE_KEYSCAN_PATH_OK=YES"
