name: Diagnose Production Runtime Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose production runtime after security release'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect runtime diagnostics
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set +e
          cd "$APP_DIR"
          echo '=== DEPLOYED SHA ==='
          cat .deployed_sha 2>/dev/null || true
          echo '=== COMPOSE PS ==='
          docker compose ps -a || true
          echo '=== WEB LOGS ==='
          docker compose logs --no-color --tail=300 web || true
          echo '=== MIGRATIONS (isolated image process) ==='
          docker compose run --rm --no-deps --entrypoint python web manage.py showmigrations cards || true
          echo '=== MIGRATE CHECK (isolated image process) ==='
          docker compose run --rm --no-deps --entrypoint python web manage.py migrate --noinput || true
          echo '=== DJANGO CHECK (isolated image process) ==='
          docker compose run --rm --no-deps --entrypoint python web manage.py check || true
          echo '=== COMMAND PRESENCE ==='
          docker compose run --rm --no-deps --entrypoint python web manage.py help verify_audit_chain || true
          echo '=== HEALTH ==='
          curl -v --max-time 10 http://127.0.0.1:8010/health/ || true
          REMOTE
          exit 0
