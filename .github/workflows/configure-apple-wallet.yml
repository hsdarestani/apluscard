name: Configure Apple Wallet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sams-apple-wallet-production
  cancel-in-progress: false

jobs:
  configure-apple-wallet:
    name: Configure and verify Apple Wallet on STRATO
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de
      WALLET_PASS_TYPE_ID: ${{ secrets.APPLE_WALLET_PASS_TYPE_ID }}
      WALLET_TEAM_ID: ${{ secrets.APPLE_WALLET_TEAM_ID }}
      WALLET_P12_BASE64: ${{ secrets.APPLE_WALLET_P12_BASE64 }}
      WALLET_P12_PASSWORD: ${{ secrets.APPLE_WALLET_P12_PASSWORD }}
      WALLET_WWDR_BASE64: ${{ secrets.APPLE_WALLET_WWDR_CERT_BASE64 }}

    steps:
      - name: Validate secrets and certificate pair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$WALLET_PASS_TYPE_ID"
          test -n "$WALLET_TEAM_ID"
          test -n "$WALLET_P12_BASE64"
          test -n "$WALLET_P12_PASSWORD"
          test -n "$WALLET_WWDR_BASE64"
          case "$WALLET_PASS_TYPE_ID" in pass.*) ;; *) exit 1 ;; esac
          test "$WALLET_TEAM_ID" = "884MVA2MD5"

          umask 077
          printf '%s' "$WALLET_P12_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/wallet.p12"
          printf '%s' "$WALLET_P12_PASSWORD" > "$RUNNER_TEMP/wallet-password"
          openssl pkcs12 -in "$RUNNER_TEMP/wallet.p12" -passin "file:$RUNNER_TEMP/wallet-password" -clcerts -nokeys -out "$RUNNER_TEMP/wallet-cert.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/wallet.p12" -passin "file:$RUNNER_TEMP/wallet-password" -nocerts -nodes -out "$RUNNER_TEMP/wallet-key.pem"
          CERT_HASH="$(openssl x509 -in "$RUNNER_TEMP/wallet-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')"
          KEY_HASH="$(openssl pkey -in "$RUNNER_TEMP/wallet-key.pem" -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$CERT_HASH" = "$KEY_HASH"
          openssl x509 -in "$RUNNER_TEMP/wallet-cert.pem" -checkend 0 -noout
          openssl x509 -in "$RUNNER_TEMP/wallet-cert.pem" -noout -subject | grep -F "$WALLET_PASS_TYPE_ID"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts

      - name: Apply Wallet secrets and verify a signed pass
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'PASS_TYPE=%s\n' "$(printf '%s' "$WALLET_PASS_TYPE_ID" | base64 -w0)"
            printf 'TEAM_ID=%s\n' "$(printf '%s' "$WALLET_TEAM_ID" | base64 -w0)"
            printf 'P12=%s\n' "$(printf '%s' "$WALLET_P12_BASE64" | tr -d '\r\n\t ' | base64 -w0)"
            printf 'P12_PASSWORD=%s\n' "$(printf '%s' "$WALLET_P12_PASSWORD" | base64 -w0)"
            printf 'WWDR=%s\n' "$(printf '%s' "$WALLET_WWDR_BASE64" | tr -d '\r\n\t ' | base64 -w0)"
          } > "$RUNNER_TEMP/wallet.env.b64"

          scp -i ~/.ssh/strato_sams -P "$SSH_PORT" "$RUNNER_TEMP/wallet.env.b64" "$SSH_USER@$SSH_HOST:$APP_DIR/.wallet.env.b64"
          ssh -i ~/.ssh/strato_sams -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' SITE_DOMAIN='$SITE_DOMAIN' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          test -s .env
          . ./.wallet.env.b64
          decode() { printf '%s' "$1" | base64 --decode; }

          PASS_TYPE_VALUE="$(decode "$PASS_TYPE")"
          TEAM_ID_VALUE="$(decode "$TEAM_ID")"
          P12_VALUE="$(decode "$P12")"
          P12_PASSWORD_VALUE="$(decode "$P12_PASSWORD")"
          WWDR_VALUE="$(decode "$WWDR")"

          tmp="$(mktemp)"
          grep -vE '^(APPLE_WALLET_PASS_TYPE_ID|APPLE_WALLET_TEAM_ID|APPLE_WALLET_P12_BASE64|APPLE_WALLET_P12_PASSWORD|APPLE_WALLET_WWDR_CERT_BASE64)=' .env > "$tmp" || true
          {
            printf 'APPLE_WALLET_PASS_TYPE_ID=%s\n' "$PASS_TYPE_VALUE"
            printf 'APPLE_WALLET_TEAM_ID=%s\n' "$TEAM_ID_VALUE"
            printf 'APPLE_WALLET_P12_BASE64=%s\n' "$P12_VALUE"
            printf 'APPLE_WALLET_P12_PASSWORD=%s\n' "$P12_PASSWORD_VALUE"
            printf 'APPLE_WALLET_WWDR_CERT_BASE64=%s\n' "$WWDR_VALUE"
          } >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" .env
          rm -f .wallet.env.b64

          docker compose up -d --build --remove-orphans
          docker compose exec -T web python manage.py check </dev/null
          docker compose exec -T web python - <<'PY' </dev/null
          import io
          import os
          import zipfile
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.test import RequestFactory
          from cards.models import Wallet
          from cards.wallet_pass import build_pkpass

          assert settings.APPLE_WALLET_ENABLED
          assert settings.APPLE_WALLET_TEAM_ID == "884MVA2MD5"
          wallet = Wallet.objects.select_related("business").order_by("created_at").first()
          assert wallet is not None
          request = RequestFactory().get("/customer/apple-wallet/", secure=True, HTTP_HOST="app.samsclublounge.de")
          payload = build_pkpass(wallet, request)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              required = {"pass.json", "manifest.json", "signature", "icon.png", "logo.png"}
              assert required.issubset(set(archive.namelist()))
          print("Signed Apple Wallet pass verified on STRATO.")
          PY
          REMOTE

      - name: Verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 30 "https://$SITE_DOMAIN/health/" >/dev/null
