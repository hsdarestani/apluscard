name: Notification Badge Regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/notification-badge-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused badge tests
        env:
          DJANGO_SECRET_KEY: badge-regression-test
          DJANGO_DEBUG: "0"
        run: python manage.py test cards.test_native_push.NotificationBadgeSyncTests -v 2
