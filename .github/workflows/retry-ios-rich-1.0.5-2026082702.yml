name: Release Sams Club Lounge iOS 1.0.5 (2026082702)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-ios-rich-1.0.5-2026082702.yml
  workflow_dispatch:

permissions:
  contents: read

# Rich-push iOS release. 1.0.4 is a closed App Store version train, so Apple
# requires a higher CFBundleShortVersionString for any new build.
jobs:
  release:
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      version_name: "1.0.5"
      build_number: "2026082702"
      upload_to_testflight: true
      submit_for_review: false
    secrets: inherit
