name: Auto Recover Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sams-auto-recover-production
  cancel-in-progress: true

jobs:
  check-and-recover:
    name: Check GitHub and recover STRATO deployment
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
      SITE_DOMAIN: app.samsclublounge.de

    steps:
      - name: Validate production access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = "217.160.50.71"
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare main with production
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          main_sha="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"

          production_sha="$(ssh -i ~/.ssh/strato_sams root@"$SSH_HOST" \
            "cd '$APP_DIR' && git rev-parse HEAD 2>/dev/null || true")"

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"
          if [ "$main_sha" != "$production_sha" ]; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Production is behind main: $production_sha -> $main_sha"
          else
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Production already matches main: $main_sha"
          fi

      - name: Dispatch tested deployment
        if: steps.compare.outputs.needs_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/dispatch.txt" \
            --write-out '%{http_code}' \
            --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/test.yml/dispatches" \
            --data '{"ref":"main"}')"
          test "$code" = "204" || {
            cat "$RUNNER_TEMP/dispatch.txt" || true
            echo "Deployment dispatch failed with HTTP $code"
            exit 1
          }
          echo "Test and Deploy was dispatched for main."

      - name: Keep production services healthy
        if: steps.compare.outputs.needs_deploy == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams root@"$SSH_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          docker compose up -d web push-worker
          docker compose exec -T web python manage.py check </dev/null
          test "$(docker compose ps --status running -q web | wc -l)" -eq 1
          test "$(docker compose ps --status running -q push-worker | wc -l)" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null
          REMOTE
          curl --fail --silent --show-error --max-time 30 "https://$SITE_DOMAIN/health/" >/dev/null
          echo "Production and push worker are healthy."
