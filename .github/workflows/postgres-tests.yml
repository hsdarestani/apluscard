name: PostgreSQL-Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apluscard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apluscard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/apluscard_test
      DJANGO_SECRET_KEY: postgres-ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_SECURE_COOKIES: "0"
      DEFAULT_BUSINESS_SLUG: shisha-bar
      PRIVILEGED_MFA_REQUIRED: "0"
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django-Systemprüfung
        run: python manage.py check
      - name: Fehlende Migrationen ausschließen
        run: python manage.py makemigrations --check --dry-run
      - name: Migrationen auf PostgreSQL anwenden
        run: python manage.py migrate --noinput
      - name: Gesamte Testsuite auf PostgreSQL ausführen
        run: python manage.py test

  production-wallet-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit-wallet-total-20260824'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.NEWHOST }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?NEWHOST is missing}"
          : "${SSH_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/sams_prod
          chmod 600 ~/.ssh/sams_prod
          ssh-keygen -y -f ~/.ssh/sams_prod >/dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Query production wallet aggregates
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -i ~/.ssh/sams_prod root@"$SSH_HOST" "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          SELECT 'TOTAL_WALLETS|' || COUNT(*) FROM cards_wallet;
          SELECT 'TOTAL_BALANCE|' || COALESCE(SUM(balance), 0) FROM cards_wallet;
          SELECT 'ACTIVE|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'ACTIVE';
          SELECT 'BLOCKED|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'BLOCKED';
          SELECT 'CLOSED|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE status = 'CLOSED';
          SELECT 'NEGATIVE|' || COUNT(*) || '|' || COALESCE(SUM(balance), 0) FROM cards_wallet WHERE balance < 0;
          SELECT 'BUSINESS|' || b.id || '|' || replace(b.name, '|', '/') || '|' || b.slug || '|' || b.currency || '|' || COUNT(w.id) || '|' || COALESCE(SUM(w.balance), 0)
          FROM cards_business b
          LEFT JOIN cards_wallet w ON w.business_id = b.id
          GROUP BY b.id, b.name, b.slug, b.currency
          ORDER BY b.id;
          SQL
          REMOTE
