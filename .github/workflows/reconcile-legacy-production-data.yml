name: Reconcile Legacy Production Data

on:
  workflow_run:
    workflows: ["Test and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sams-legacy-production-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_commit.message == 'Run mapped legacy production reconciliation once')
    name: Map and merge missing legacy data into canonical PostgreSQL
    runs-on: ubuntu-latest
    environment: production
    env:
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PORT: "22"
      NEW_USER: root
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard

    steps:
      - name: Validate migration access
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${OLD_HOST:?HETZNER_HOST is missing}"
          : "${OLD_PASSWORD:?HETZNER_PASSWORD is missing}"
          : "${NEW_HOST:?NEWHOST is missing}"
          : "${NEW_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is missing}"
          test "$NEW_HOST" = "217.160.50.71"

      - name: Configure SSH clients
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan -H -p "$NEW_PORT" "$NEW_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture frozen legacy database and missing media
        id: legacy
        shell: bash
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          SNAPSHOT_DIR="$RUNNER_TEMP/sams-legacy-reconcile"
          mkdir -p "$SNAPSHOT_DIR"
          chmod 700 "$SNAPSHOT_DIR"

          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "cd '$APP_DIR' && docker compose exec -T db sh -lc 'pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Fc'" \
            > "$SNAPSHOT_DIR/legacy.dump"

          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "cd '$APP_DIR' && docker compose run --rm -T --no-deps --entrypoint sh web -lc 'tar -C /app/media -czf - .'" \
            > "$SNAPSHOT_DIR/legacy-media.tar.gz"

          test -s "$SNAPSHOT_DIR/legacy.dump"
          test -s "$SNAPSHOT_DIR/legacy-media.tar.gz"
          chmod 600 "$SNAPSHOT_DIR"/*
          sha256sum "$SNAPSHOT_DIR/legacy.dump" "$SNAPSHOT_DIR/legacy-media.tar.gz"
          echo "dir=$SNAPSHOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload legacy snapshot to canonical server
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/strato_sams -P "$NEW_PORT" \
            "${{ steps.legacy.outputs.dir }}/legacy.dump" \
            "${{ steps.legacy.outputs.dir }}/legacy-media.tar.gz" \
            "$NEW_USER@$NEW_HOST:/root/"

      - name: Backup current data, reconcile and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$NEW_PORT" "$NEW_USER@$NEW_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          LEGACY_DUMP=/root/legacy.dump
          LEGACY_MEDIA=/root/legacy-media.tar.gz
          LEGACY_DB="apluscard_legacy_reconcile_$(date -u +%Y%m%d%H%M%S)"
          BACKUP_DIR=/root/sams-reconcile-backups
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP="$BACKUP_DIR/pre-legacy-merge-$(date -u +%Y%m%dT%H%M%SZ).dump"

          test -s "$LEGACY_DUMP"
          test -s "$LEGACY_MEDIA"
          test -f cards/management/commands/reconcile_legacy_database.py
          docker compose up -d db >/dev/null

          docker compose exec -T db sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP"
          test -s "$BACKUP"
          chmod 600 "$BACKUP"
          sha256sum "$BACKUP"

          rollback() {
            status=$?
            echo "Reconciliation failed. Restoring the exact pre-merge canonical backup." >&2
            set +e
            docker compose stop push-worker web
            docker compose up -d db
            docker compose exec -T db sh -lc \
              'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner --no-privileges' \
              < "$BACKUP"
            docker compose exec -T db sh -lc "dropdb -U \"\$POSTGRES_USER\" --if-exists '$LEGACY_DB'" >/dev/null 2>&1
            docker compose up -d --remove-orphans
            rm -f "$LEGACY_DUMP" "$LEGACY_MEDIA"
            exit "$status"
          }
          trap rollback ERR

          docker compose stop push-worker web
          docker compose up -d db
          docker compose exec -T db sh -lc "createdb -U \"\$POSTGRES_USER\" '$LEGACY_DB'"
          docker compose exec -T db sh -lc \
            "pg_restore -U \"\$POSTGRES_USER\" -d '$LEGACY_DB' --no-owner --no-privileges" \
            < "$LEGACY_DUMP"

          docker compose run --rm -T --no-deps web \
            python manage.py reconcile_legacy_database --legacy-db-name "$LEGACY_DB" </dev/null

          # The current server wins on file-name collisions; only files that are
          # actually missing from the canonical media volume are restored.
          docker compose run --rm -T --no-deps --entrypoint sh web -lc \
            'tar --skip-old-files -xzf - -C /app/media' < "$LEGACY_MEDIA"

          docker compose exec -T db sh -lc "dropdb -U \"\$POSTGRES_USER\" '$LEGACY_DB'"
          docker compose up -d --remove-orphans

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          docker compose exec -T web python manage.py migrate --noinput </dev/null
          docker compose exec -T web python manage.py check </dev/null
          docker compose exec -T web python manage.py check_database_integrity </dev/null

          docker compose exec -T web python manage.py shell -c '
          from django.contrib.auth import get_user_model
          from cards.models import Wallet, MemberProfile, PaymentRequest, LedgerEntry, PushDevice, ReviewStatus
          from cards.legal_models import LegalAcceptance, PrivacyPreference
          print("FINAL_COUNTS", {
              "users": get_user_model().objects.count(),
              "wallets": Wallet.objects.count(),
              "profiles": MemberProfile.objects.count(),
              "privacy": PrivacyPreference.objects.count(),
              "legal": LegalAcceptance.objects.count(),
              "reviews": ReviewStatus.objects.count(),
              "push_devices": PushDevice.objects.count(),
              "payments": PaymentRequest.objects.count(),
              "ledger": LedgerEntry.objects.count(),
          })
          ' </dev/null

          trap - ERR
          rm -f "$LEGACY_DUMP" "$LEGACY_MEDIA"
          echo "MAPPED_LEGACY_RECONCILIATION_OK=YES"
          echo "Pre-merge rollback backup retained: $BACKUP"
          REMOTE
