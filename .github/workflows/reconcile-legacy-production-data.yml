name: Reconcile Legacy Production Data

on:
  workflow_run:
    workflows: ["Test and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sams-legacy-production-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_commit.message == 'Retry mapped legacy reconciliation with strict verification')
    name: Strict mapped merge of legacy production data
    runs-on: ubuntu-latest
    environment: production
    env:
      OLD_HOST: ${{ secrets.HETZNER_HOST }}
      OLD_PORT: ${{ secrets.HETZNER_PORT }}
      OLD_USER: ${{ secrets.HETZNER_USER }}
      OLD_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      NEW_HOST: ${{ secrets.NEWHOST }}
      NEW_PORT: "22"
      NEW_USER: root
      NEW_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      APP_DIR: /root/apluscard

    steps:
      - name: Validate migration access
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${OLD_HOST:?HETZNER_HOST is missing}"
          : "${OLD_PASSWORD:?HETZNER_PASSWORD is missing}"
          : "${NEW_HOST:?NEWHOST is missing}"
          : "${NEW_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is missing}"
          test "$NEW_HOST" = "217.160.50.71"

      - name: Configure SSH clients
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEW_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/strato_sams
          chmod 600 ~/.ssh/strato_sams
          ssh-keygen -y -f ~/.ssh/strato_sams >/dev/null
          ssh-keyscan -H -p "${OLD_PORT:-22}" "$OLD_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan -H -p "$NEW_PORT" "$NEW_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture frozen legacy PostgreSQL and media
        id: legacy
        shell: bash
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          SNAPSHOT_DIR="$RUNNER_TEMP/sams-legacy-reconcile"
          mkdir -p "$SNAPSHOT_DIR"
          chmod 700 "$SNAPSHOT_DIR"
          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "cd '$APP_DIR' && docker compose exec -T db sh -lc 'pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Fc'" \
            > "$SNAPSHOT_DIR/legacy.dump"
          sshpass -e ssh -p "${OLD_PORT:-22}" "$OLD_USER@$OLD_HOST" \
            "cd '$APP_DIR' && docker compose run --rm -T --no-deps --entrypoint sh web -lc 'tar -C /app/media -czf - .'" \
            > "$SNAPSHOT_DIR/legacy-media.tar.gz"
          test -s "$SNAPSHOT_DIR/legacy.dump"
          test -s "$SNAPSHOT_DIR/legacy-media.tar.gz"
          chmod 600 "$SNAPSHOT_DIR"/*
          echo "dir=$SNAPSHOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot to canonical server
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/strato_sams -P "$NEW_PORT" \
            "${{ steps.legacy.outputs.dir }}/legacy.dump" \
            "${{ steps.legacy.outputs.dir }}/legacy-media.tar.gz" \
            "$NEW_USER@$NEW_HOST:/root/"

      - name: Reconcile with mandatory persistence checks
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/strato_sams -p "$NEW_PORT" "$NEW_USER@$NEW_HOST" \
            "APP_DIR='$APP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          LEGACY_DUMP=/root/legacy.dump
          LEGACY_MEDIA=/root/legacy-media.tar.gz
          LEGACY_DB="apluscard_legacy_reconcile_$(date -u +%Y%m%d%H%M%S)"
          COMMAND_LOG=/root/legacy-reconcile-command.log
          BACKUP_DIR=/root/sams-reconcile-backups
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP="$BACKUP_DIR/pre-legacy-merge-$(date -u +%Y%m%dT%H%M%SZ).dump"

          rollback() {
            original_status="${1:-1}"
            echo "RECONCILIATION_ROLLBACK=YES original_status=$original_status" >&2
            set +e
            docker compose stop push-worker web >/dev/null 2>&1
            docker compose up -d db >/dev/null 2>&1
            if [ -s "$BACKUP" ]; then
              docker compose exec -T db sh -lc \
                'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner --no-privileges' \
                < "$BACKUP"
            fi
            docker compose exec -T db sh -lc "dropdb -U \"\$POSTGRES_USER\" --if-exists '$LEGACY_DB'" >/dev/null 2>&1
            docker compose up -d --remove-orphans >/dev/null 2>&1
            if [ -s "$COMMAND_LOG" ]; then
              echo "--- reconciliation command output ---" >&2
              tail -n 120 "$COMMAND_LOG" >&2
            fi
            rm -f "$LEGACY_DUMP" "$LEGACY_MEDIA" "$COMMAND_LOG"
            exit 1
          }
          trap 'rollback $?' ERR

          test -s "$LEGACY_DUMP"
          test -s "$LEGACY_MEDIA"
          test -f cards/management/commands/reconcile_legacy_database.py
          docker compose up -d db >/dev/null

          docker compose exec -T db sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP"
          test -s "$BACKUP"
          chmod 600 "$BACKUP"
          echo "PRE_MERGE_BACKUP_OK=YES"

          docker compose stop push-worker web >/dev/null
          docker compose up -d db >/dev/null
          docker compose exec -T db sh -lc "createdb -U \"\$POSTGRES_USER\" '$LEGACY_DB'"
          docker compose exec -T db sh -lc \
            "pg_restore -U \"\$POSTGRES_USER\" -d '$LEGACY_DB' --no-owner --no-privileges" \
            < "$LEGACY_DUMP"

          LEGACY_USERS="$(docker compose exec -T db sh -lc "psql -U \"\$POSTGRES_USER\" -d '$LEGACY_DB' -Atc 'SELECT count(*) FROM auth_user'" | tr -d '\r')"
          LEGACY_WALLETS="$(docker compose exec -T db sh -lc "psql -U \"\$POSTGRES_USER\" -d '$LEGACY_DB' -Atc 'SELECT count(*) FROM cards_wallet'" | tr -d '\r')"
          LEGACY_PROFILES="$(docker compose exec -T db sh -lc "psql -U \"\$POSTGRES_USER\" -d '$LEGACY_DB' -Atc 'SELECT count(*) FROM cards_memberprofile'" | tr -d '\r')"
          echo "LEGACY_COUNTS users=$LEGACY_USERS wallets=$LEGACY_WALLETS profiles=$LEGACY_PROFILES"

          set +e
          docker compose run --rm -T --no-deps web \
            python manage.py reconcile_legacy_database --legacy-db-name "$LEGACY_DB" \
            > "$COMMAND_LOG" 2>&1
          command_status=$?
          set -e
          if [ "$command_status" -ne 0 ]; then
            echo "RECONCILE_COMMAND_FAILED=$command_status" >&2
            rollback "$command_status"
          fi

          echo "--- reconciliation summary ---"
          grep -E 'Legacy-Reconciliation|POST_COUNTS|(_inserted|_mapped_to_existing_identity|_current_wins|_total)=' "$COMMAND_LOG" || true

          CURRENT_USERS="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM auth_user"' | tr -d '\r')"
          CURRENT_WALLETS="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM cards_wallet"' | tr -d '\r')"
          CURRENT_PROFILES="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM cards_memberprofile"' | tr -d '\r')"
          echo "CURRENT_COUNTS users=$CURRENT_USERS wallets=$CURRENT_WALLETS profiles=$CURRENT_PROFILES"

          test "$CURRENT_USERS" -ge "$LEGACY_USERS" || { echo "Persisted users are still incomplete." >&2; false; }
          test "$CURRENT_WALLETS" -ge "$LEGACY_WALLETS" || { echo "Persisted wallets are still incomplete." >&2; false; }
          test "$CURRENT_PROFILES" -ge "$LEGACY_PROFILES" || { echo "Persisted profiles are still incomplete." >&2; false; }

          # Current files always win; restore only legacy media files that are absent.
          docker compose run --rm -T --no-deps --entrypoint sh web -lc \
            'tar --skip-old-files -xzf - -C /app/media' < "$LEGACY_MEDIA"

          docker compose exec -T db sh -lc "dropdb -U \"\$POSTGRES_USER\" '$LEGACY_DB'"
          docker compose up -d --remove-orphans >/dev/null

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          docker compose exec -T web python manage.py migrate --noinput </dev/null
          docker compose exec -T web python manage.py check </dev/null
          docker compose exec -T web python manage.py check_database_integrity </dev/null

          trap - ERR
          rm -f "$LEGACY_DUMP" "$LEGACY_MEDIA" "$COMMAND_LOG"
          echo "MAPPED_LEGACY_RECONCILIATION_PERSISTED=YES"
          echo "ROLLBACK_BACKUP_RETAINED=$BACKUP"
          REMOTE
