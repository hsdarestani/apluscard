name: Trigger Android 1.0.3 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-android-1.0.2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    name: Dispatch signed Android 1.0.3 build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android App Bundle build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          payload='{"ref":"main","inputs":{"version_name":"1.0.3","version_code":"6"}}'
          response_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/build-android-release.yml/dispatches" \
            --data "$payload")"
          test "$response_code" = "204" || {
            cat "$RUNNER_TEMP/dispatch-response.txt" || true
            echo "Android workflow dispatch failed with HTTP $response_code"
            exit 1
          }
          echo "Android 1.0.3 build with version code 6 was dispatched."
