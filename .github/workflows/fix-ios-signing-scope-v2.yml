name: Apply iOS Signing Scope Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-ios-signing-scope-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix-and-rebuild:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Apply iOS signing scope fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Remove global signing overrides from archive command
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/build-ios-testflight.yml
          grep -q 'DEVELOPMENT_TEAM="$IOS_TEAM_ID"' "$workflow"
          grep -q 'CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"' "$workflow"
          sed -i '/^[[:space:]]*DEVELOPMENT_TEAM="$IOS_TEAM_ID" \\$/,/^[[:space:]]*CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \\$/d' "$workflow"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"' "$workflow" && {
            echo "Global provisioning override still exists"
            exit 1
          }
          git diff --check
          git diff -- "$workflow"

      - name: Commit workflow correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-ios-testflight.yml
          git commit -m "Scope iOS provisioning to app target"
          git push origin HEAD:main

      - name: Dispatch corrected TestFlight build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          sleep 4
          payload='{"ref":"main","inputs":{"version_name":"1.0.2","build_number":"2026080602","upload_to_testflight":"true"}}'
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/response.txt" --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/actions/workflows/build-ios-testflight.yml/dispatches" --data "$payload")"
          test "$code" = "204" || {
            cat "$RUNNER_TEMP/response.txt" || true
            echo "Dispatch failed with HTTP $code"
            exit 1
          }
          echo "Corrected iOS build dispatched."
