name: Apply SAMS Operations Patch

on:
  push:
    branches: [main]
    paths:
      - "ops/apply_sams_patch.py"
      - "ops/patch_chunks/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage SAMS operations patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared patch
        run: python ops/apply_sams_patch.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/apply-sams-patch.yml
      - name: Commit implementation
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Implement SAMS payment, push, mobile UI and domain migration"
          git push origin HEAD:main
