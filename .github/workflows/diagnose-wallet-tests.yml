name: Diagnose Wallet Tests

on:
  push:
    branches: [agent/fix-apple-wallet-native]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Run focused Wallet tests and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          DJANGO_DEBUG: "1"
          DJANGO_SECURE_COOKIES: "0"
        run: |
          set +e
          python manage.py test cards.test_apple_wallet_handoff cards.test_native_push cards.test_member_experience.AppleWalletPayloadTests -v 2 > /tmp/wallet-tests.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo 'Wallet test failure.'
              echo
              echo '```text'
              tail -n 180 /tmp/wallet-tests.txt
              echo '```'
            } > /tmp/issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Temporary Wallet diagnostic" --body-file /tmp/issue-body.md
          fi
          cat /tmp/wallet-tests.txt
          exit "$status"
